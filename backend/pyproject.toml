[project]
name = "risk-profiler"
version = "0.1.0"
description = "Insurance claim risk profiling backend API"
authors = [
    { name = "Viacheslav Danilov", email = "viacheslav.v.danilov@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "autogluon>=1.5.0",
    "fastapi>=0.128.0",
    "numpy>=1.24.0",
    "shap>=0.45.0",
    "openai>=1.0.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.12.5",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "autogluon>=1.5.0",
    "shap>=0.45.0",
    "httpx>=0.28.1",
    "ipykernel>=7.1.0",
    "matplotlib>=3.10.8",
    "mypy>=1.19.1",
    "pandas>=2.0.0,<2.4.0",
    "pip>=26.0.1",
    "pre-commit>=4.5.1",
    "pyarrow>=7.0.0,<21.0.0",
    "pytest>=9.0.3",
    "ruff>=0.14.14",
    "scikit-learn>=1.0.0,<1.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_version = "3.13"
exclude = ["venv", ".venv", "tests"]
ignore_missing_imports = true
disallow_untyped_decorators = false
disallow_untyped_calls = false
explicit_package_bases = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["risk_profiler"]
